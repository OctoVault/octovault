image:
  repository: ghcr.io/octovault/octovault-operator
  tag: v0.0.3-rc2
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: "octovault"
fullnameOverride: "octovault"

replicaCount: 1
leaderElection:
  enabled: true

serviceAccount:
  create: true
  name: "octovault-controller-manager"
  annotations: {}

rbac:
  create: true

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Controller flags
controller:
  metrics:
    enabled: true
    secure: true           # true -> :8443(HTTPS), false -> :8080(HTTP)
    port: 8443
  probes:
    healthz: ":8081"
  enableHTTP2: false
  extraArgs: []            # 추가 플래그
  env:
    # 컨트롤러 동시성 (컨트롤러가 동시에 처리할 작업 수)
    MAX_WORKERS: 1
    # PAT 접근 권한 검증 결과를 신뢰하는 기간이자, OctoRepository 재검증 주기.
    # 이 주기당 GitHub 프로브 요청은 최대 1회 발생한다. 낮추면 rate limit 소모가 늘어난다.
    GIT_CRED_TTL: "10m"
    GIT_API_URL: "https://api.github.com"
    GIT_REF: "main" # empty if you want to use default branch
    # true 로 두면 observedRevision 을 커밋 SHA 로 기록하되 폴링마다 GitHub 요청이
    # 1개 추가된다. false 면 contents 응답에 포함된 blob SHA 를 그대로 쓴다.
    GIT_REVISION_FROM_COMMIT: "false"
    # values.yaml 과 함께 조회할 스키마 파일명. 비우면 요청하지 않는다.
    # 스키마 검증기가 주입되기 전까지는 비워 둘 것. 현재 빌드에는 검증기가 없어 값을 넣어도
    # 무시된다(시작 로그에 안내). 검증기를 붙인 뒤 지정하면 폴링마다 요청이 1개 추가된다.
    GIT_SCHEMA_FILE: ""
    # Aws Secret Manager Configuration
    AWS_REGION: ""    # if empty, will use default region from aws sdk by itself (recommended)
    AWS_SM_TTL: "3m"
    AWS_PS_TTL: "3m"
    AWS_CACHE_MAX_ENTRIES: "1024" # per provider; raise if octovault_aws_cache_evictions_total keeps growing

  extraEnv: []             # [{name: FOO, value: BAR}, ...]
  extraVolumeMounts: []
  extraVolumes: []

# 선택: Prometheus Operator ServiceMonitor
prometheus:
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    scheme: https # metrics.secure=true 권장
    # Without metrics.existingSecret the controller serves a self-signed certificate, and
    # Prometheus rejects it unless tlsConfig trusts it. See README "Observability".
    tlsConfig: {}

# (옵션) 메트릭 서버에 제공할 인증서가 있다면 Secret로 주입
metrics:
  existingSecret: ""     # e.g. octovault-metrics-tls (keys: tls.crt, tls.key)
  certPath: "/certs"     # 컨테이너 마운트 경로
  # Subjects allowed to scrape the secure metrics endpoint (bound to <fullname>-metrics-reader), e.g.
  # - kind: ServiceAccount
  #   name: prometheus-k8s
  #   namespace: monitoring
  readerSubjects: []
